# copiar para frontend_restaurante/nginx.conf
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # arquivos do Vite têm hash no nome -> podem ficar em cache "para sempre"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: qualquer rota que não seja arquivo devolve o index.html
    # (sem isso, F5 em /pedidos dá 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
